name: Flutter CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        default: true
        type: boolean

# Cancel any in-progress run on the same branch when a newer push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # CI ─ Runs on every push, PR, and manual dispatch
  # ─────────────────────────────────────────────────────────────────
  ci:
    name: 🔍 Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --fatal-infos

      - name: 🧪 Run tests
        run: flutter test

  # ─────────────────────────────────────────────────────────────────
  # CD ─ Runs on push to main / master or manual workflow_dispatch
  # Produces signed Release APK (+ AAB) with project keystore.
  # ─────────────────────────────────────────────────────────────────
  cd:
    name: 📦 Build & Release
    runs-on: ubuntu-latest
    needs: ci
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 📱 Set up Android NDK (r27b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          cache: true
          link-to-sdk: true

      - name: 🐘 Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🐦 Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      # ── Derive version & auto-increment versionCode ──────────────
      - name: 🏷️ Derive version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          VERSION_CODE=${{ github.run_number }}
          TAG="v${VERSION}-build${VERSION_CODE}"
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "flutter.versionCode=${VERSION_CODE}" >> android/local.properties
          echo "flutter.versionName=${VERSION}"      >> android/local.properties
          if [ -n "${ANDROID_NDK_HOME}" ]; then
            echo "ndk.dir=${ANDROID_NDK_HOME}"       >> android/local.properties
          fi

      # ── Restore Keystore & key.properties ────────────────────────
      - name: 🔑 Decode Keystore & Restore key.properties
        run: |
          mkdir -p android/app
          base64 -d android/keystore_base64.txt > android/app/money_manager.keystore
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD || 'MoneyManager2026' }}
          keyPassword=${{ secrets.KEY_PASSWORD || 'MoneyManager2026' }}
          keyAlias=${{ secrets.KEY_ALIAS || 'money_manager' }}
          storeFile=money_manager.keystore
          EOF

      # ── Build exactly ONE release APK ────────────────────────────
      - name: 🔨 Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # ── Rename to a human-friendly filename ──────────────────────
      - name: 📋 Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/MoneyManager-${{ steps.version.outputs.tag }}.apk

      # ── Upload as workflow artifact ──────────────────────────────
      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-${{ steps.version.outputs.tag }}
          path: build/app/outputs/flutter-apk/MoneyManager-${{ steps.version.outputs.tag }}.apk
          retention-days: 30

      # ── Create GitHub Release ────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Money Manager ${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.code }}) 🚀"
          body: |
            ## 📦 Money Manager — Automated Release

            **Build Tag:** `${{ steps.version.outputs.tag }}`
            **Version Code:** `${{ steps.version.outputs.code }}`
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ---

            ### 📲 Downloads & Installation
            1. Download `MoneyManager-${{ steps.version.outputs.tag }}.apk` below.
            2. Tap the APK to install or update the app on your Android device (no uninstall required).

            ### ✅ Automated Verification
            - [x] Static Analysis (`flutter analyze --fatal-infos`) passed.
            - [x] All 48 unit & integration tests passed.
            - [x] Single release APK signed with production keystore.
          files: build/app/outputs/flutter-apk/MoneyManager-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
